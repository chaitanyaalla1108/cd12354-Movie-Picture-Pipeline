name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'starter/backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'starter/backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          cd starter/backend
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Linting
        run: |
          cd starter/backend
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Tests
        run: |
          cd starter/backend
          pip install pytest
          pytest