name: Backend Continuous Integration

on:
 workflow_dispatch:
 pull_request:
  branches: [ main ]
  paths:
    - "starter/backend/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv & Dependencies
        run: |
          pip install pipenv
          cd starter/backend
          pipenv install --dev

      - name: Run Linter
        run: |
          cd starter/backend
          pipenv run flake8

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv & Dependencies
        run: |
          pip install pipenv
          cd starter/backend
          pipenv install --dev

      - name: Run Tests
        run: |
          cd starter/backend
          pipenv run pytest
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t backend.ci starter/backend
    